<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viví el Sur — prototipo</title>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Comforter+Brush&family=Red+Hat+Display:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #F4EEE8; }
  .frame { padding: 9px; border-radius: 52px; background: #0F0E12; box-shadow: 0 30px 70px -30px rgba(10, 6, 20, .5); }
  .frame > div { width: 351px; height: 711px; overflow: hidden; border-radius: 43px; background: #fff; }
  .app { width: 390px; height: 790px; overflow: hidden; transform: scale(.9); transform-origin: 0 0; }
</style>
</head>
<body>
<div class="frame"><div><div class="app" id="app" data-screen="top" data-nav></div></div></div>
<script>window.__base = '../';</script>
<script src="../js/icons.js"></script>
<script src="../js/app.js"></script>
<script>
  const s = new URLSearchParams(location.search).get('screen');
  if (s) document.getElementById('app').dataset.screen = s;
</script>
</body>
</html>
